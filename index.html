<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Разработка теста — курс</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#21322d;background:#f5f3ec}*{box-sizing:border-box}body{margin:0}header{background:#173f35;color:white;padding:18px max(5vw,24px);display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:800;letter-spacing:.03em}.tag{font-size:13px;color:#c6e2d3}.progress{height:5px;background:#d7e4da}.progress span{display:block;height:100%;background:#e3a442;transition:.3s}main{max-width:1050px;margin:auto;padding:42px 24px 100px}.eyebrow{color:#ae6325;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.13em}h1{font-size:clamp(30px,5vw,50px);line-height:1.09;letter-spacing:-.035em;margin:13px 0 18px;max-width:850px}h2{font-size:23px;margin:0 0 12px}p{font-size:18px;line-height:1.55;max-width:800px}.lead{font-size:20px;color:#50665d}.hero,.card,.rule,.quiz,.result{border-radius:20px;padding:26px;margin:22px 0}.hero{background:#e6eee5;display:grid;grid-template-columns:1fr 1fr;gap:16px}.scene{background:#fff;border-radius:16px;padding:22px;min-height:150px}.scene .icon{font-size:36px}.scene strong{display:block;margin:10px 0}.rule{background:#173f35;color:#fff}.rule p{margin:8px 0;color:#e6f2e9}.rule small{color:#bfe1cb;text-transform:uppercase;letter-spacing:.12em;font-weight:700}.quiz{background:#fff;box-shadow:0 5px 25px #2345330d}.quiz p{margin-top:0}.options{display:grid;gap:10px}.option{border:1.5px solid #d7e1da;border-radius:12px;padding:15px;display:flex;gap:12px;cursor:pointer;line-height:1.45}.option:has(input:checked){border-color:#31745c;background:#eef7f0}.option input{accent-color:#236949;margin-top:4px;flex:none}.button{border:0;border-radius:10px;padding:14px 22px;background:#24654d;color:white;font-size:15px;font-weight:700;cursor:pointer}.button:hover{background:#174a38}.button:disabled{opacity:.45;cursor:not-allowed}.check{margin-top:16px}.feedback{margin-top:16px;padding:16px;border-radius:12px;line-height:1.5}.good{background:#e1f3e6;color:#205c37}.bad{background:#fff0df;color:#804c1e}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}.flow div,.tile{background:#fff;border:1px solid #e0e8df;border-radius:16px;padding:20px}.flow b{display:block;color:#286d50;margin-bottom:8px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.tile strong{display:block;color:#286d50;font-size:20px;margin-bottom:8px}.note{color:#64776c;font-size:14px}.checklist{display:grid;gap:10px}.checklist div{background:white;border-radius:12px;padding:16px}.checklist div:before{content:'✓';color:#2e805b;font-weight:bold;margin-right:12px}nav{position:fixed;bottom:0;background:#fff;border-top:1px solid #e1e8e0;width:100%;padding:14px max(calc((100vw - 1000px)/2),24px);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:2}.secondary{background:#edf2ed;color:#345b49}.counter{font-size:13px;color:#63776c}.intro-number{font-size:13px;color:#e1a14e;font-weight:bold}.endlink{color:#286d50} @media(max-width:650px){main{padding-top:28px}.hero,.flow,.tiles{grid-template-columns:1fr}.scene{min-height:0}h1{font-size:32px}.quiz,.rule,.hero{padding:19px}nav{padding:12px}.tag{display:none}p{font-size:16px}}
 .illustration{border-radius:20px;overflow:hidden;margin:24px 0;background:#e6eee5}.illustration img{display:block;width:100%;height:auto}.worked{background:#fff7e9;border-left:5px solid #df9e4b;border-radius:12px;padding:18px 22px;margin:22px 0}.worked p{margin:8px 0;font-size:16px}.reveal{background:#ffffff;border:1px solid #d7e1da;border-radius:16px;margin:20px 0}.reveal summary{cursor:pointer;list-style:none;font-weight:750;font-size:21px;color:#173f35;padding:19px 22px;display:flex;justify-content:space-between}.reveal summary::-webkit-details-marker{display:none}.reveal>div{padding:0 22px 12px}.reveal p{font-size:18px}</style></head><body><header><div><div class="brand">АГЕНТЫ ОБУЧЕНИЯ</div><div class="tag">Упрощённая программа · Модуль 3</div></div><div class="tag">≈ 15 минут</div></header><div class="progress"><span id="bar"></span></div><main id="app"></main><nav><button class="button secondary" id="back">← Назад</button><span class="counter" id="counter"></span><button class="button" id="next">Далее →</button></nav><script>
const quiz=(question,options,correct,good,bad,multiple=false)=>({question,options,correct,good,bad,multiple});
const pages=[
{label:'Начало · 1 минута',title:'Тест пройден. А к работе сотрудник готов?',body:`<p class="lead">Сотрудник прошёл курс и успешно ответил на вопросы. На смене он выдал Гостю неполный заказ. Поможем разобраться, что проверить в тесте.</p><div class="hero"><div class="scene"><span class="icon">✓</span><strong>В курсе</strong>Тест пройден успешно</div><div class="scene"><span class="icon">☕</span><strong>На смене</strong>Гость не получил напиток</div></div>`,q:quiz('Какой вопрос лучше покажет, готов ли сотрудник проверить заказ перед выдачей?',['Как называется раздел курса о выдаче заказа?','Что ты сделаешь, если перед выдачей заметишь, что в заказе нет напитка?','Почему Гостям важно получать полный заказ?','Кто обычно выдаёт заказ Гостю?'],[1],'Вопрос проверяет действие в ситуации, которая может возникнуть на работе.','Этот вопрос проверяет другую информацию. Выбери вопрос, в котором сотрудник принимает решение в рабочей ситуации.')},
{label:'Шаг 1 · цель и вопрос',title:'Сначала реши, что проверяешь',body:`<p class="lead">Вопрос должен помогать понять, достиг ли сотрудник результата обучения.</p><div class="flow"><div><b>1 · Знает</b>Что входит в заказ</div><div><b>2 · Понимает</b>Зачем сверять состав</div><div><b>3 · Применяет</b>Проверяет заказ и действует при ошибке</div></div><div class="rule"><small>Правило</small><p>Если результат — рабочее действие, предложи ситуацию, в которой сотрудник должен выбрать это действие.</p></div>`,q:quiz('Цель: сотрудник проверяет состав заказа перед выдачей. Какой уровень нужен?',['Знание','Понимание','Применение'],[2],'Верно: сотруднику нужно применить знания в рабочей ситуации.','Посмотри на действие в цели: сотрудник не только вспоминает правило, но и проверяет заказ.')},
{label:'Попробуй сам',title:'Выбери вопрос под цель',body:`<p class="lead">Цель обучения: сотрудник сверяет состав заказа перед выдачей.</p>`,q:quiz('Какой вопрос лучше проверит эту цель?',['Где в курсе описана проверка заказа?','Почему важно сверять состав заказа?','Что ты сверишь перед выдачей заказа по чеку и содержимому пакета?','Кто отвечает за проверку заказа на станции?'],[2],'Вопрос просит выполнить действие из цели обучения.','Сравни вопрос с целью: нужно проверить именно действие сотрудника перед выдачей.')},
{label:'Шаг 2 · формулировка',title:'Добавь понятную ситуацию',body:`<div class="tiles"><div class="tile"><strong>Слишком широко</strong>«Что сделаешь, если возникла проблема?»<p class="note">Какая проблема и когда она возникла?</p></div><div class="tile"><strong>Понятнее</strong>«Перед выдачей ты заметил, что в заказе нет напитка. Что сделаешь?»</div></div><div class="rule"><small>Правило</small><p>Дай достаточно контекста, чтобы вопрос можно было понять однозначно. Начни с действия: «Выбери верный вариант».</p></div>`,q:quiz('Как лучше переписать вопрос «Что сделаешь, если есть проблема?»',['Выбери верный вариант. Что ты сделаешь, если перед выдачей заметишь, что в заказе нет напитка?','Выбери верный вариант. Что ты сделаешь, если заметишь проблему с заказом?','Выбери верный вариант. Что ты сделаешь, если заказ окажется неправильным?','Выбери верный вариант. Что ты сделаешь при сложной ситуации на выдаче?'],[0],'Здесь указан момент действия и описана конкретная ошибка.','Уточни ситуацию: что произошло и в какой момент?')},
{label:'Шаг 2 · формулировка',title:'Оставь решение ученику',body:`<div class="rule"><small>Правило</small><p>Не называй правильное действие в вопросе. Ученик должен выбрать его сам.</p></div><div class="tiles"><div class="tile"><strong>Подсказка</strong>«Ты ведь проверишь заказ, если в нём нет напитка?»</div><div class="tile"><strong>Нейтрально</strong>«Что ты сделаешь, если в заказе нет напитка?»</div></div>`,q:quiz('Какой вопрос меньше подсказывает ответ?',['Что ты сделаешь, если перед выдачей заметишь, что в заказе нет напитка?','Ты ведь проверишь заказ, если перед выдачей заметишь, что в нём нет напитка?','Почему при отсутствии напитка нужно проверить заказ?','Как правильно проверить заказ и сообщить менеджеру об отсутствии напитка?'],[0],'Здесь описана ситуация, а действие сотрудник выбирает сам.','Найди формулировку, которая не называет предполагаемое действие.')},
{label:'Шаг 3 · варианты ответа',title:'Предложи реальные варианты',body:`<p class="lead">Хорошие неверные ответы похожи на действия, которые сотрудник действительно может выбрать по ошибке.</p><div class="rule"><small>Правило</small><p>Все ответы относятся к одной ситуации. Убери повторы и подсказки в длине или форме ответа.</p></div>`,q:quiz('Выбери 3 возможные ошибки для вопроса о недостающем напитке.',['Отмечу заказ как готовый и выдам его Гостю','Добавлю напиток, не сверяя заказ с чеком','Оставлю заказ на выдаче до следующей смены','Проверю срок годности масла','Посчитаю Гостей в зале','Проверю заказ и сообщу менеджеру'],[0,1,2],'Эти действия относятся к ситуации и могут служить неверными вариантами в учебном примере.','Выбери действия, связанные с заказом, кроме задуманного верного действия — сверить заказ и сообщить менеджеру.',true)},
{label:'Шаг 3 · форматы вопроса',title:'Один ответ или несколько?',body:`<div class="tiles"><div class="tile"><strong>Один верный</strong>4 варианта ответа, из них 1 верный.</div><div class="tile"><strong>Несколько верных</strong>Рекомендуется 5 вариантов: минимум 2 верных и минимум 2 неверных.</div></div><div class="rule"><small>Правило памятки</small><p>Выбирай формат по задаче. Во вступлении напиши: «Выбери верный вариант» или «Выбери все верные варианты».</p></div>`,q:quiz('Нужно выбрать все подходящие действия для проверки заказа. Какой формат подходит?',['Единичный выбор','Множественный выбор'],[1],'Верно: в задаче требуется выбрать несколько действий.','Здесь нужно отметить более одного действия.')},
{label:'Шаг 4 · обратная связь',title:'Помоги понять ошибку',body:`<p class="lead">Обратная связь превращает ошибку в подсказку для следующей попытки.</p><div class="rule"><small>Правило</small><p>Объясни последствие ошибки и верное действие. После верного ответа подтверди, почему он подходит.</p></div>`,q:quiz('Ученик выбрал: «Выдам заказ без напитка». Какая обратная связь полезнее?',['Неверно. Попробуй ещё раз','Неверно. Повтори весь раздел о выдаче заказов','В заказе останется ошибка. Сверь состав с чеком и уточни дальнейшее действие у менеджера','Неверно. Ты выбрал не тот вариант'],[2],'Ответ объясняет последствие и подсказывает следующий шаг.','Выбери ответ, который объясняет последствие и помогает исправить действие.')},
{label:'Шаг 5 · оформление',title:'Проверь, легко ли читать',body:`<div class="tiles"><div class="tile"><strong>Вступление</strong>«Выбери верный вариант» или «Выбери все верные варианты».</div><div class="tile"><strong>Вопрос</strong>Обращайся на «ты», пиши просто и без отрицаний.</div><div class="tile"><strong>Ответы</strong>После вопроса с вопросительным словом начинай ответ с большой буквы и не ставь точку в конце.</div><div class="tile"><strong>Детали</strong>Числа, даты и единицы измерения сверь с полной памяткой.</div></div>`,q:quiz('Какая формулировка проще для чтения?',['Чего НЕ нужно делать при ошибке в заказе?','Что ты сделаешь при ошибке в заказе?'],[1],'Прямой вопрос проще читать: ответ не нужно мысленно переворачивать.','Попробуй выбрать прямой вопрос без отрицания.')},
{label:'Финальная тренировка · 1 из 3',title:'Собери вопрос целиком',body:`<p class="lead">Цель: сотрудник проверяет состав заказа перед выдачей. Выбери формулировку, ответы и обратную связь.</p>`,q:quiz('Шаг 1. Какая формулировка подойдёт?',['Выбери верный вариант. Что ты сделаешь, если перед выдачей заметишь, что в заказе нет напитка?','Выбери верный вариант. Что ты сделаешь, если с заказом что-то не так?'],[0],'Ситуация конкретная: понятно, что и когда произошло.','Уточни, какая ошибка произошла и в какой момент.')},
{label:'Финальная тренировка · 2 из 3',title:'Подбери варианты ответа',body:`<p class="lead">Вопрос: «Что ты сделаешь, если перед выдачей заметишь, что в заказе нет напитка?»</p>`,q:quiz('Шаг 2. Какой набор вариантов лучше?',['Сверю заказ с чеком и уточню действие у менеджера; Добавлю напиток без сверки; Выдам заказ без напитка; Оставлю заказ на выдаче','Сверю заказ с чеком и уточню действие у менеджера; Проверю температуру масла; Открою отчёт; Подготовлю график'],[0],'Все варианты связаны с одной ситуацией.','Ищи набор, в котором все варианты относятся к заказу.')},
{label:'Финальная тренировка · 3 из 3',title:'Объясни ошибку',body:`<p class="lead">Ученик выбрал ответ: «Выдам заказ без напитка».</p>`,q:quiz('Шаг 3. Какая обратная связь поможет ему?',['Неверно. Читай внимательнее','Так ошибка останется в заказе. Перед выдачей сверь состав с чеком и уточни дальнейшее действие у менеджера'],[1],'Готово: ты выбрал понятный вопрос, варианты по теме и обратную связь с объяснением.','Объясни последствие ошибки и следующий шаг.')},
{label:'Завершение',title:'Чек-лист для работы',body:`<p class="lead">Перед публикацией проверь каждый вопрос. Сверяй технические детали с полной памяткой по составлению тестовых вопросов.</p><div class="checklist"><div><b>Цель.</b> Вопрос проверяет нужное знание, понимание или рабочее действие.</div><div><b>Вопрос.</b> Ситуация понятна, формулировка не подсказывает ответ.</div><div><b>Ответы.</b> Варианты связаны с ситуацией, правдоподобны и не повторяются.</div><div><b>Обратная связь.</b> Объясняет верное действие и помогает исправить ошибку.</div><div><b>Оформление.</b> Вступление, количество ответов и язык соответствуют памятке.</div></div><div class="rule"><small>Следующий шаг</small><p>Используй чек-лист и памятку при выполнении итогового задания. Его инструкция будет добавлена после разработки задания.</p></div>`}];

// Теория расположена перед практикой, чтобы сотрудник мог сначала разобрать правило.
const teaching=[
{at:1,label:'Разбираемся · зачем нужен тест',title:'Тест показывает готовность к работе',body:`<p class="lead">Хороший тест помогает понять, что сотрудник сможет сделать после курса. Поэтому начинаем с результата обучения, а не с придумывания вопросов.</p><div class="illustration"><img src="restaurant-training.png" alt="Сотрудник и наставник проверяют заказ по чеку"></div><div class="flow"><div><b>1 · Результат</b>Сотрудник проверяет заказ перед выдачей</div><div><b>2 · Вопрос</b>Что он сделает, если заметит недостающий напиток?</div><div><b>3 · Вывод</b>Ответ покажет, может ли он выбрать действие</div></div><div class="rule"><small>Запомни</small><p>Один вопрос проверяет конкретный результат. Для разных результатов могут понадобиться разные вопросы.</p></div>`},
{at:2,label:'Разбираемся · уровни вопросов',title:'Знать, понимать, применять',body:`<p class="lead">Одну тему можно проверить на разных уровнях. Выбирай уровень по тому, что человек должен делать после обучения.</p><div class="tiles"><div class="tile"><strong>Знание</strong>Вспомнить факт или правило.<p>«Какие данные нужно сверить в заказе?»</p></div><div class="tile"><strong>Понимание</strong>Объяснить смысл правила.<p>«Почему перед выдачей важно сверить заказ с чеком?»</p></div><div class="tile"><strong>Применение</strong>Выбрать действие в ситуации.<p>«Напитка нет в пакете. Как ты проверишь заказ?»</p></div><div class="tile"><strong>Как выбрать?</strong>Смотри на цель: назвать — знание, объяснить — понимание, действовать — применение.</div></div><div class="rule"><small>Пример</small><p>Если цель — проверять заказы, вопрос «Почему проверка важна?» полезен, но сам по себе не показывает, как сотрудник будет действовать.</p></div>`},
{at:4,label:'Разбираемся · вопрос',title:'Собери понятный вопрос',body:`<p class="lead">Читатель должен понять, что произошло, когда нужно действовать и что от него ожидается.</p><div class="flow"><div><b>Вступление</b>Выбери верный вариант.</div><div><b>Ситуация</b>Перед выдачей в заказе не хватает напитка.</div><div><b>Задача</b>Что ты сделаешь?</div></div><div class="tiles"><div class="tile"><strong>Было</strong>«Что ты сделаешь, если возникла проблема?»<p class="note">Неясно, о какой проблеме речь.</p></div><div class="tile"><strong>Стало</strong>«Перед выдачей ты заметил, что в заказе нет напитка. Что ты сделаешь?»<p class="note">Ситуация конкретная, действие выбирает ученик.</p></div></div>`},
{at:5,label:'Разбираемся · ответы',title:'Как придумать неверные ответы',body:`<p class="lead">Начни с верного действия по утверждённому материалу. Затем подумай, какие ошибки реально может допустить человек в этой же ситуации.</p><div class="flow"><div><b>Верное действие</b>Сверить заказ с чеком и уточнить дальнейшие действия.</div><div><b>Возможная ошибка</b>Добавить напиток без сверки с чеком.</div><div><b>Проверь варианты</b>Они отвечают на вопрос, различаются по смыслу и не выдают ответ оформлением.</div></div><div class="rule"><small>Практический приём</small><p>Спроси себя: «Мог бы новичок так поступить?» Если ответ очевидно не относится к ситуации, замени его правдоподобным.</p></div>`},
{at:7,label:'Разбираемся · обратная связь',title:'Объясни, что делать дальше',body:`<p class="lead">Обратная связь нужна, чтобы после ошибки сотрудник понял последствия и смог выбрать правильное действие. В проверочном тесте её показ и момент показа зависят от настроек курса.</p><div class="flow"><div><b>1 · Что произошло</b>Заказ останется неполным.</div><div><b>2 · Что сделать</b>Сверить его с чеком и уточнить дальнейшие действия.</div><div><b>3 · Зачем</b>Это поможет исправить ошибку перед выдачей.</div></div><div class="tiles"><div class="tile"><strong>Мало пользы</strong>«Неверно. Читай внимательнее».</div><div class="tile"><strong>Помогает учиться</strong>«Заказ останется неполным. Сверь его с чеком и уточни дальнейшие действия».</div></div>`}
];
for(const t of teaching.slice().reverse()){const {at,...page}=t;pages.splice(at,0,page)}
// Часть прежних проверок оставлена как наглядные разборы: чередуем чтение и тренировку.
for(const title of ['Сначала реши, что проверяешь','Оставь решение ученику','Проверь, легко ли читать']){const p=pages.find(x=>x.title===title);if(p&&p.q){p.body+=`<div class="worked"><b>Пример</b><p>${p.q.question}</p><p><strong>Решение:</strong> ${p.q.options[p.q.correct[0]]}</p><p class="note">${p.q.good}</p></div>`;delete p.q}}


// В курсе остаются только ключевые тренировки; остальные примеры превращены в раскрывающиеся разборы.
const keepQuestions=['Выбери вопрос под цель','Предложи реальные варианты','Собери вопрос целиком','Подбери варианты ответа'];
for (const page of pages) {
 if(page.q&&!keepQuestions.includes(page.title)){
  const q=page.q;const answer=q.correct.map(i=>q.options[i]).join('; ');
  page.body+=`<details class="reveal"><summary>Разобрать пример <span>＋</span></summary><div><p>${q.question}</p><p><b>Решение:</b> ${answer}</p><p>${q.good}</p></div></details>`;
  delete page.q;
 }
}
const intro=pages.find(p=>p.title==='Тест пройден. А к работе сотрудник готов?');
intro.body=`<p class="lead">Сотрудник прошёл курс и успешно ответил на вопросы. На смене он выдал Гостю неполный заказ. Давай разберёмся, как составить тест, который поможет увидеть готовность к работе.</p><div class="illustration cover"><img src="bk-order-no-apron.png" alt="Сотрудники Бургер Кинг проверяют заказ"></div><details class="reveal"><summary>Что могло пойти не так? <span>＋</span></summary><div><p>В тесте спрашивали о содержании курса, но не предложили ситуацию, где нужно проверить заказ и принять решение.</p></div></details>`;
const theory=pages.find(p=>p.title==='Тест показывает готовность к работе');theory.body=theory.body.replace('restaurant-training.png','bk-learning-design.png').replace('Сотрудник и наставник проверяют заказ по чеку','Агенты обучения разрабатывают тест за ноутбуком');
const picturePages=[['Объясни, что делать дальше','bk-learning-design.png','Агенты обучения обсуждают обратную связь к вопросу']];
for(const [title,src,alt] of picturePages){const page=pages.find(p=>p.title===title);if(page)page.body=`<div class="illustration"><img src="${src}" alt="${alt}"></div>`+page.body}


// Убираем повтор одного и того же разбора: структура вопроса и пример даны на одном экране.
const duplicate=pages.findIndex(p=>p.title==='Добавь понятную ситуацию');if(duplicate>=0)pages.splice(duplicate,1);
const promptPage=pages.find(p=>p.title==='Собери понятный вопрос');
if(promptPage)promptPage.body=promptPage.body.replace('<div class="tiles"><div class="tile"><strong>Было</strong>«Что ты сделаешь, если возникла проблема?»<p class="note">Неясно, о какой проблеме речь.</p></div><div class="tile"><strong>Стало</strong>«Перед выдачей ты заметил, что в заказе нет напитка. Что ты сделаешь?»<p class="note">Ситуация конкретная, действие выбирает ученик.</p></div></div>', '<p class="note">Три части складываются в один вопрос. Достаточный контекст помогает ученику понять, о какой ситуации идёт речь.</p>');
const hintPage=pages.find(p=>p.title==='Оставь решение ученику');
if(hintPage)hintPage.body=hintPage.body.replace(/<div class="worked">[\s\S]*?<\/div>/,'');
const exercise=pages.find(p=>p.title==='Предложи реальные варианты');
if(exercise){exercise.body=`<p class="lead">Ты составляешь вопрос: «Что ты сделаешь, если перед выдачей заметишь, что в заказе нет напитка?»</p><div class="rule"><small>Верное действие для этого примера</small><p>Сверю заказ с чеком и уточню дальнейшее действие у менеджера.</p></div><p>Выбери три неверных действия, которые относятся к этой ситуации и могут выглядеть правдоподобно. После проверки ты сможешь продолжить.</p>`;exercise.q.question='Какие 3 варианта можно предложить как неверные ответы?';exercise.q.options=['Выдам заказ, не сверяя его с чеком','Добавлю напиток, не проверив состав заказа по чеку','Отмечу заказ как готовый, не исправив ошибку','Проверю срок годности масла','Посчитаю Гостей в зале','Сверю заказ с чеком и уточню дальнейшее действие у менеджера'];exercise.q.bad='Подходят первые три действия: они относятся к заказу и описывают возможные ошибки. Два варианта относятся к другой работе, а последний — верное действие. Измени выбор и проверь ещё раз или продолжи.';exercise.q.good='Первые три действия связаны с заказом и показывают возможные ошибки сотрудника.';exercise.q.allowContinue=true;}

let current=0;const state={};const app=document.querySelector('#app'),next=document.querySelector('#next'),back=document.querySelector('#back');function render(){let p=pages[current];let completed=state[current]?.done;document.querySelector('#bar').style.width=((current+1)/pages.length*100)+'%';document.querySelector('#counter').textContent=`${current+1} / ${pages.length}`;back.disabled=current===0;next.textContent=current===pages.length-1?'В начало ↺':'Далее →';next.disabled=!!p.q&&!completed;app.innerHTML=`<div class="eyebrow">${p.label}</div><h1>${p.title}</h1>${p.body||''}`;if(p.q){let q=p.q,box=document.createElement('section');box.className='quiz';box.innerHTML=`<h2>${q.question}</h2><p class="note">${q.multiple?'Отметь 3 варианта, затем нажми «Проверить»':'Выбери один вариант и нажми «Проверить»'}</p><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="${q.multiple?'checkbox':'radio'}" name="answer" value="${i}"><span>${o}</span></label>`).join('')}</div><button class="button check">Проверить</button><div class="feedback" hidden aria-live="polite"></div>`;app.appendChild(box);box.querySelector('.check').onclick=()=>{let selected=[...box.querySelectorAll('input:checked')].map(x=>+x.value);let fb=box.querySelector('.feedback');fb.hidden=false;if(!selected.length){fb.className='feedback bad';fb.textContent='Выбери ответ, чтобы продолжить.';return}let ok=selected.length===q.correct.length&&q.correct.every(i=>selected.includes(i));fb.className='feedback '+(ok?'good':'bad');fb.innerHTML='<strong>'+(ok?'Верно! ':'Попробуй ещё раз. ')+'</strong>'+(ok?q.good:q.bad);if(ok||q.allowContinue){state[current]={done:true};next.disabled=false;if(!ok&&q.allowContinue)fb.innerHTML+='<br><br>Кнопка «Далее» доступна. Можно также изменить выбор и проверить ещё раз.'}};if(completed){box.querySelector('.feedback').hidden=false;box.querySelector('.feedback').className='feedback good';box.querySelector('.feedback').textContent='Задание выполнено. Можно продолжить.'}}window.scrollTo(0,0)}back.onclick=()=>{if(current>0){current--;render()}};next.onclick=()=>{if(current<pages.length-1)current++;else current=0;render()};render();</script></body></html>
